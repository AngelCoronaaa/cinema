<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3d9bff"/>
      <stop offset="1" stop-color="#0a4fd6"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.32"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- Squircle-like rounded square (iOS corner ratio ≈ 22.5%) -->
  <rect width="512" height="512" rx="115" fill="url(#bg)"/>
  <rect width="512" height="512" rx="115" fill="url(#sheen)"/>
  <rect x="3" y="3" width="506" height="506" rx="112" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="6"/>
  <!-- Play glyph with soft corners, optically centred -->
  <path d="M206 168 L346 256 L206 344 Z" fill="#ffffff" stroke="#ffffff" stroke-width="44" stroke-linejoin="round"/>
</svg>
